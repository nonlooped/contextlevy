name: ContextLevy
description: Estimate AI agent context overhead introduced by a pull request diff.
branding:
  icon: alert
  color: purple

inputs:
  github-token:
    description: 'Fallback token with pull-requests: write when GitHub App auth is not configured'
    required: false
  create-check:
    description: 'Publish a GitHub Check Run named ContextLevy (requires checks: write)'
    required: false
    default: 'true'
  upload-sarif:
    description: 'Upload SARIF for Code Scanning annotations (requires security-events: write)'
    required: false
    default: 'true'
  app-client-id:
    description: 'ContextLevy GitHub App ID. Falls back to CONTEXTLEVY_APP_ID or CONTEXTLEVY_APP_CLIENT_ID env var.'
    required: false
  app-private-key:
    description: 'ContextLevy GitHub App private key PEM. Falls back to CONTEXTLEVY_APP_PRIVATE_KEY env var.'
    required: false
  app-installation-id:
    description: 'Optional installation ID override. Falls back to CONTEXTLEVY_APP_INSTALLATION_ID env var.'
    required: false

outputs:
  total-estimated-tokens:
    description: Total estimated AI-context tokens added by this PR (integer as string)
  analyzed-file-count:
    description: Number of changed files included in the estimate (integer as string)
  token-source:
    description: 'Auth source used for the run: app, github-token, or GITHUB_TOKEN'
  estimation-mode:
    description: 'Token estimation mode used for this run: simple or tokenizer'
  risk-level:
    description: 'Aggregated PR context risk level: Low, Medium, High, or Critical'
  check-conclusion:
    description: 'GitHub Check Run conclusion when create-check is enabled'
  badge-url:
    description: 'shields.io badge URL for PR context risk'
  badge-markdown:
    description: 'Markdown image tag for PR/README badges'
  sarif-path:
    description: 'Path to the generated SARIF file in the workspace'
  sarif-uploaded:
    description: 'Whether SARIF was uploaded to GitHub Code Scanning (true/false)'

runs:
  using: node20
  main: dist/index.js
